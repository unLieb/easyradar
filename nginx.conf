server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /data/ {
        proxy_pass http://ultrafeeder/data/;
    }

    location /external/ {
        # Docker's embedded DNS resolver - needed here because the upstream host is
        # only known via the $-variable below, and nginx only re-resolves a variable
        # hostname at request time (rather than once at startup) if a resolver is set.
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $adsbfi_upstream opendata.adsb.fi;
        proxy_ssl_server_name on;
        proxy_set_header Host opendata.adsb.fi;
        # proxy_pass with a variable does NOT auto-append the rest of the matched
        # location's URI the way a static proxy_pass would - it silently dropped
        # everything after /external/, so adsb.fi only ever received bare "/api/v3/"
        # (400 Bad Request) instead of "/api/v3/lat/X/lon/Y/dist/Z". Explicit rewrite
        # reconstructs the full upstream path before proxy_pass forwards it as-is.
        rewrite ^/external/(.*)$ /api/v3/$1 break;
        proxy_pass https://$adsbfi_upstream;
    }

    location /stats-api/ {
        proxy_pass http://radar-stats:8090/api/;
    }

    location /geocode/ {
        # Docker's embedded DNS resolver - needed here because the upstream host is
        # only known via the $-variable below, and nginx only re-resolves a variable
        # hostname at request time (rather than once at startup) if a resolver is set.
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $nominatim_upstream nominatim.openstreetmap.org;
        proxy_ssl_server_name on;
        proxy_set_header Host nominatim.openstreetmap.org;
        proxy_set_header User-Agent "easyRADAR/1.0 (private hobby ADS-B project)";
        proxy_pass https://$nominatim_upstream/reverse$is_args$args;
    }

    location = /CHANGELOG.md {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
