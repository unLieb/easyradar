server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /data/ {
        proxy_pass http://ultrafeeder/data/;
    }

    location /external/ {
        resolver 127.0.0.11 valid=30s;
        proxy_ssl_server_name on;
        proxy_set_header Host opendata.adsb.fi;
        proxy_pass https://opendata.adsb.fi/api/v3/;
    }

    location /stats-api/ {
        proxy_pass http://radar-stats:8090/api/;
    }

    location /geocode/ {
        resolver 127.0.0.11 valid=30s;
        proxy_ssl_server_name on;
        proxy_set_header Host nominatim.openstreetmap.org;
        proxy_set_header User-Agent "easyRADAR/1.0 (private hobby ADS-B project)";
        proxy_pass https://nominatim.openstreetmap.org/reverse$is_args$args;
    }

    location = /CHANGELOG.md {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
